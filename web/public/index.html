<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.R.I.A</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace}
button,input,select,textarea{font:inherit;color:#fff;background:#000;border:1px solid #333;border-radius:0}
button{cursor:pointer;padding:6px 12px;transition:.2s}
button:hover:not(:disabled){background:#fff;color:#000}
button:disabled{opacity:.3;cursor:default}
select{height:30px;padding:0 5px;max-width:190px}
[hidden]{display:none!important}
:focus-visible{outline:1px solid #fff;outline-offset:2px}
#app{display:grid;grid-template:"h h h" 56px "c m a" 1fr/240px 1fr 280px;height:100%}
#app.hc{grid-template-columns:0 1fr 280px}#app.hc #hist{display:none}
#app.nm{grid-template-columns:0 1fr 0}#app.nm aside,#app.nm #hist{display:none}
#hist{grid-area:c;border-right:1px solid #222;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.hist-top{padding:12px}.hist-top button{width:100%;text-align:left}
#chat-history{flex:1;overflow:auto;padding:0 8px}
.hist-row{display:flex;align-items:center}
.hist-row>button:first-child{flex:1;min-width:0;border:0;text-align:left;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#999;font-size:12px}
.hist-row.on>button:first-child{background:#1a1a1a;color:#fff}
.hist-del{border:0;color:#555;padding:4px 8px;opacity:0}.hist-row:hover .hist-del,.hist-del:focus-visible{opacity:1}
.hist-note{padding:10px 12px;color:#555;font-size:10px;border-top:1px solid #222}
header{grid-area:h;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #222}
.logo{font-weight:700;letter-spacing:.5em;animation:logo 1.2s both}
nav{display:flex;gap:8px;align-items:center}
nav .on{background:#fff;color:#000}
main{grid-area:m;display:flex;flex-direction:column;min-width:0;min-height:0}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;padding:28px}
#msgs,#welcome{max-width:720px;margin:auto}
#welcome{margin-top:18vh;text-align:center}
#welcome .who{padding-left:.3em}
#welcome .who{animation:up .8s both}
#gr{animation:up 1s .35s both}
.tag{text-align:center;padding-left:.3em;color:#555;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
.m{padding:18px 0;border-bottom:1px solid #222;overflow-wrap:anywhere;animation:up .4s both}
.who{text-transform:uppercase;font-size:11px;letter-spacing:.3em;color:#777;margin-bottom:6px}
.user .md{color:#999;white-space:pre-wrap}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md .tw,.md h3{margin:.6em 0}
.md ul,.md ol{padding-left:1.6em}
.md pre{border:1px solid #333;padding:10px;overflow:auto}
.md blockquote{border-left:1px solid #fff;padding-left:12px;color:#999}
.md a{color:#fff}.md hr{border:0;border-top:1px solid #333}
.tw{overflow:auto}.md td,.md th{border:1px solid #333;padding:5px 8px;text-align:left}
.c{border:0;border-bottom:1px solid #fff;padding:0 3px;background:none}
.c.on{background:#fff;color:#000}
details{margin:10px 0}
summary{cursor:pointer;color:#777;list-style:none;transition:color .2s}
summary:hover{color:#fff}
summary::before{content:"+ ";}details[open]>summary::before{content:"− "}
.th>div{color:#777;font-size:12px;white-space:pre-wrap;padding:6px 0 0 14px;max-height:200px;overflow:auto}
.refs>.src{margin:8px 0 8px 14px;border-left:1px solid #333;padding-left:12px}
.src small{display:block;color:#777}.ex{white-space:pre-wrap;margin-top:6px;color:#999}
mark{background:#fff;color:#000;animation:flash .9s}
aside{grid-area:a;border-left:1px solid #222;padding:20px;overflow:auto}
aside h4{text-align:center;padding-left:.3em;font-size:11px;letter-spacing:.3em;color:#777;font-weight:400;margin-bottom:16px}
footer{padding:12px 28px 18px;max-width:776px;width:100%;margin:auto}
#f{border:1px solid #333;padding:12px;transition:border-color .3s}#f:focus-within{border-color:#fff}
#q{width:100%;border:0;resize:none;min-height:46px;max-height:150px;outline:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{color:#777;font-size:12px}
#err,#setup,.ns{color:#fff;border:1px solid #fff;padding:8px 12px;margin:8px 0;font-size:12px}
dialog{margin:auto;background:#000;color:#fff;border:1px solid #fff;padding:28px;width:min(380px,92vw);animation:up .4s both}
dialog::backdrop{background:#000d}
dialog label{display:block;margin:14px 0}dialog input{display:block;width:100%;padding:9px;margin-top:5px}
dialog button{width:100%;margin-top:8px}#le{color:#fff;font-size:12px}
#nv-wrap{display:flex;flex:1;min-height:0}
#nl{width:240px;border-right:1px solid #222;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
#nl button{text-align:left;border:0;padding:5px 8px;overflow-wrap:anywhere;font-size:12px;color:#777}
#nl button.on{color:#000;background:#fff}
#ed{flex:1;resize:none;padding:16px;border:0;outline:0;line-height:1.7}
.nb{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #222}.nb span{color:#777;font-size:12px;flex:1}
.modes{display:flex;gap:4px}
.mb{display:flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;font-size:10px;line-height:1;letter-spacing:.15em;color:#777}
.mb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.mb.ico{padding:0 8px}
.mb.on{background:#fff;color:#000;border-color:#fff}
.sw{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{width:30px;height:16px;border:1px solid #fff;position:relative;transition:.25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:#fff;transition:.25s}
.sw input:checked+i{background:#fff}.sw input:checked+i::after{background:#000;transform:translateX(14px)}
.sw input:focus-visible+i{outline:1px solid #fff;outline-offset:2px}
.warn{border:1px solid #fff;padding:4px 8px;margin-top:6px;font-size:12px;animation:up .3s both}
#send,#add{border:0;height:30px;padding:0 8px;font-size:20px;line-height:1}
#send:hover:not(:disabled),#add:hover:not(:disabled){background:none;color:#fff;transform:translateY(-2px)}
#att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}#att:empty{display:none}
.at{display:flex;align-items:center;gap:6px;border:1px solid #333;padding:2px 4px 2px 6px;font-size:11px;color:#999;max-width:210px;animation:up .25s both}
.at img{width:22px;height:22px;object-fit:cover}.at>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at button{border:0;padding:0 4px;color:#777}
.pick{position:relative}
#pm{position:absolute;bottom:36px;left:0;width:250px;flex-direction:column;flex-wrap:nowrap;gap:0;align-items:stretch;background:#000;border:1px solid #fff;z-index:6;animation:up .2s both}
.pg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5}
.pg{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:10px;letter-spacing:.2em;color:#777}.pg.off{border-top:1px solid #222;color:#444}
.po{display:block;width:100%;text-align:left;border:0;padding:6px 12px 6px 24px}.po small{display:block;color:#777;font-size:11px}
.po.on{background:#fff;color:#000}.po.on small{color:#555}
.ab{display:flex;gap:8px}
#cur{font-size:11px;color:#777;margin-bottom:12px;overflow-wrap:anywhere;animation:up .3s both}#cur:empty{display:none}
.vn{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:8px}
.fh{position:relative;padding:2px 6px 2px 16px;color:#bbb;font-size:13px;overflow-wrap:anywhere}
.fh::before{content:"▾";position:absolute;left:2px;color:#777;font-size:10px}
.fk{margin-left:7px;padding-left:10px;border-left:1px solid #222}
.fi{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 6px;color:#777;font-size:13px;text-align:left;overflow-wrap:anywhere;animation:in .4s both;transition:color .3s,background .3s}
.fi b{font-weight:400;font-size:10px;color:#444;flex:none}
.fi.hot{color:#fff;background:#111;box-shadow:inset 2px 0 #fff;animation:in .4s both,glow 1.2s .4s infinite}
.fi.lit{color:#000;background:#fff;box-shadow:none;animation:none}.fi.lit b{color:#555}
/* PATH: vault -> folder -> note states, plus the search log */
.vn{margin-top:14px}.vn[data-s]::after{content:" · " attr(data-s);color:#555;text-transform:none;letter-spacing:0}.vn.skip{opacity:.35}
.fh.dim:not(.used){opacity:.35}.fh.used{color:#fff}
.fi.rd{color:#bbb}.fi.ct{color:#000;background:#fff;box-shadow:none;animation:none}.fi.ct b{color:#000}
#slog{font-size:11px;color:#777;margin:0 0 12px}#slog:empty{display:none}#slog div{padding:2px 0;overflow-wrap:anywhere}
@keyframes glow{50%{background:#1f1f1f}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px #fff3}}
@keyframes flash{from{background:#000;color:#fff}}
@keyframes logo{from{opacity:0;letter-spacing:1.2em}}
#pt{display:none}
@media(max-width:860px){#app,#app.nm,#app.hc{grid-template:"h" 56px "m" 1fr/1fr}#pt{display:flex}
#hist{position:fixed;top:56px;left:0;bottom:0;width:260px;background:#000;z-index:5}
aside{position:fixed;top:56px;right:0;bottom:0;width:260px;background:#000;transform:translateX(100%);transition:.3s;z-index:5}#app.pt aside{transform:none}
#nv-wrap{flex-direction:column}#nl{width:auto;max-height:30%;border:0}header{padding:0 14px}.logo{letter-spacing:.3em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/quick.css"></head><body>
<div id="app">
<header><div style="display:flex;align-items:center;gap:12px"><button id="ht" class="mb ico" title="Chat history" aria-label="Toggle chat history"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16"/></svg></button><span class="logo">A.R.I.A</span></div><nav><button id="pt" class="mb" title="Vault path"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v4h4M12 14v4h4"/></svg>PATH</button><button id="tc" class="mb ico on" aria-label="Chat" title="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button id="tn" class="mb" title="Notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>NOTES</button><button id="tq" class="mb" title="Quick Note">QUICK</button><button id="out" class="mb" title="Sign out" hidden><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>OUT</button></nav></header>
<div id="hist" role="navigation" aria-label="Chat history"><div class="hist-top"><button id="new-chat">+ New chat</button></div><div id="chat-history"></div><div class="hist-note">Last 10 · saved on this browser</div></div>
<main>
<section id="chat" class="view"><div class="chat-history-bar"><button id="resume-chat" hidden>Resume research</button><button id="pause-chat" hidden>Pause</button></div><div id="setup" hidden></div><div class="scroll" id="scroll"><div id="welcome"><div class="who">ARIA</div><div id="gr" class="who"></div></div><div id="msgs" aria-live="polite"></div></div>
<footer><div id="err" role="alert" hidden></div><form id="f"><div id="att"></div><input type="file" id="file" accept="image/*,application/pdf" multiple hidden><textarea id="q" rows="2" maxlength="4000" placeholder="???" aria-label="Message"></textarea><div class="row"><div><div class="pick"><button type="button" id="mp" class="mb ico" aria-haspopup="true" aria-label="Model"><svg viewBox="0 0 24 24"><path d="M12 2c.5 5.5 4.5 9.5 10 10-5.5.5-9.5 4.5-10 10-.5-5.5-4.5-9.5-10-10 5.5-.5 9.5-4.5 10-10z"/></svg></button><div id="pm" hidden></div></div><input type="hidden" id="model"><div class="modes"><button type="button" id="mc" class="mb on" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>CHAT</button><button type="button" id="mv" class="mb" aria-label="Vault"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="1"/><circle cx="12" cy="11.5" r="3.5"/><path d="M12 11.5l2-2M6 19v2M18 19v2"/></svg>VAULT</button></div><input type="hidden" id="mode" value="general"><select id="vault" aria-label="Vault" hidden></select><label class="sw"><input type="checkbox" id="concise"><i></i>Concise</label></div><div><button type="button" id="add" aria-label="Attach files" title="Attach files or paste an image">+</button><button id="send" aria-label="Send">↑</button></div></div></form><div class="tag">Ataraxia: Retrieval &amp; Indexing Augmentation (A.R.I.A)</div></footer></section>
<section id="notes" class="view" hidden></section>
<section id="quick" class="view" hidden></section>
</main>
<aside><h4>PATH</h4><div id="cur"></div><div id="trail"></div></aside>
</div>
<dialog id="login"><form id="lf"><div class="logo" style="margin-bottom:18px">A.R.I.A</div><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><p id="le" role="alert"></p><button id="lb">Enter</button><button type="button" id="skip">Close</button></form></dialog>
<dialog id="ask"><form id="af"><label id="al"></label><input id="av" autocomplete="off"><div class="ab"><button type="button" id="ac">Cancel</button><button id="ao">OK</button></div></form></dialog>
<script type="module" src="/shell.js"></script></body></html>
