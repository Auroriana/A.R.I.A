<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.R.I.A</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace}
button,input,select,textarea{font:inherit;color:#fff;background:#000;border:1px solid #333;border-radius:0}
button{cursor:pointer;padding:6px 12px;transition:.2s}
button:hover:not(:disabled){background:#fff;color:#000}
button:disabled{opacity:.3;cursor:default}
select{padding:5px;max-width:190px}
[hidden]{display:none!important}
:focus-visible{outline:1px solid #fff;outline-offset:2px}
#app{display:grid;grid-template:"h h" 56px "m a" 1fr/1fr 280px;height:100%}
#app.nm{grid-template-columns:1fr 0}#app.nm aside{display:none}
header{grid-area:h;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #222}
.logo{font-weight:700;letter-spacing:.5em;animation:logo 1.2s both}
nav{display:flex;gap:8px;align-items:center}
nav .on{background:#fff;color:#000}
#who{color:#777;font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
main{grid-area:m;display:flex;flex-direction:column;min-width:0;min-height:0}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;padding:28px}
#msgs,#welcome{max-width:720px;margin:auto}
#welcome{color:#777;margin-top:12vh;animation:up .8s both}
.m{padding:18px 0;border-bottom:1px solid #222;overflow-wrap:anywhere;animation:up .4s both}
.who{font-size:11px;letter-spacing:.3em;color:#777;margin-bottom:6px}
.user .md{color:#999;white-space:pre-wrap}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md .tw,.md h3{margin:.6em 0}
.md ul,.md ol{padding-left:1.6em}
.md pre{border:1px solid #333;padding:10px;overflow:auto}
.md blockquote{border-left:1px solid #fff;padding-left:12px;color:#999}
.md a{color:#fff}.md hr{border:0;border-top:1px solid #333}
.tw{overflow:auto}.md td,.md th{border:1px solid #333;padding:5px 8px;text-align:left}
.c{border:0;border-bottom:1px solid #fff;padding:0 3px;background:none}
.c.on{background:#fff;color:#000}
details{margin:10px 0}
summary{cursor:pointer;color:#777;list-style:none;transition:color .2s}
summary:hover{color:#fff}
summary::before{content:"+ ";}details[open]>summary::before{content:"− "}
.th>div{color:#777;font-size:12px;white-space:pre-wrap;padding:6px 0 0 14px;max-height:200px;overflow:auto}
.refs>.src{margin:8px 0 8px 14px;border-left:1px solid #333;padding-left:12px}
.src small{display:block;color:#777}.ex{white-space:pre-wrap;margin-top:6px;color:#999}
mark{background:#fff;color:#000;animation:flash .9s}
aside{grid-area:a;border-left:1px solid #222;padding:20px;overflow:auto}
aside h4{font-size:11px;letter-spacing:.3em;color:#777;font-weight:400;margin-bottom:16px}
#empty{color:#444;font-size:12px}
.n{position:relative;padding:0 0 14px 20px;color:#555;font-size:12px;overflow-wrap:anywhere;animation:in .5s both;transition:color .4s}
.n::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border:1px solid #fff;border-radius:50%;transition:.4s}
.n::after{content:"";position:absolute;left:3px;top:17px;bottom:0;width:1px;background:#333;transform-origin:top;animation:grow .5s both}
.n:last-child::after{display:none}
.n.q::before{border-radius:0}
.n.hot{color:#fff}.n.hot::before{background:#fff;animation:pulse 1.2s infinite}
.n.lit{color:#000;background:#fff;padding-left:22px}.n.lit::before{background:#000;border-color:#000;left:6px}
footer{padding:12px 28px 18px;max-width:776px;width:100%;margin:auto}
#f{border:1px solid #333;padding:12px;transition:border-color .3s}#f:focus-within{border-color:#fff}
#q{width:100%;border:0;resize:none;min-height:46px;max-height:150px;outline:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{color:#777;font-size:12px}
#err,#setup,.ns{color:#fff;border:1px solid #fff;padding:8px 12px;margin:8px 0;font-size:12px}
#hint{color:#555;font-size:11px;margin-top:8px}
dialog{margin:auto;background:#000;color:#fff;border:1px solid #fff;padding:28px;width:min(380px,92vw);animation:up .4s both}
dialog::backdrop{background:#000d}
dialog label{display:block;margin:14px 0}dialog input{display:block;width:100%;padding:9px;margin-top:5px}
dialog button{width:100%;margin-top:8px}#le{color:#fff;font-size:12px}
#nv-wrap{display:flex;flex:1;min-height:0}
#nl{width:240px;border-right:1px solid #222;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
#nl button{text-align:left;border:0;padding:5px 8px;overflow-wrap:anywhere;font-size:12px;color:#777}
#nl button.on{color:#000;background:#fff}
#ed{flex:1;resize:none;padding:16px;border:0;outline:0;line-height:1.7}
.nb{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #222}.nb span{color:#777;font-size:12px;flex:1}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px #fff3}}
@keyframes flash{from{background:#000;color:#fff}}
@keyframes logo{from{opacity:0;letter-spacing:1.2em}}
#pt{display:none}
@media(max-width:860px){#app,#app.nm{grid-template:"h" 56px "m" 1fr/1fr}#pt{display:inline-block}
aside{position:fixed;top:56px;right:0;bottom:0;width:260px;background:#000;transform:translateX(100%);transition:.3s;z-index:5}#app.pt aside{transform:none}
#nv-wrap{flex-direction:column}#nl{width:auto;max-height:30%;border:0}header{padding:0 14px}.logo{letter-spacing:.3em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
<header><span class="logo">A.R.I.A</span><nav><span id="who"></span><button id="pt" title="Vault path">Path</button><button id="tc" class="on">Chat</button><button id="tn">Notes</button><button id="out" hidden>Out</button></nav></header>
<main>
<section id="chat" class="view"><div id="setup" hidden></div><div class="scroll" id="scroll"><div id="welcome">Ask anything.<br>Choose “Search my notes” and watch the path on the right.</div><div id="msgs" aria-live="polite"></div></div>
<footer><div id="err" role="alert" hidden></div><form id="f"><textarea id="q" rows="2" maxlength="4000" placeholder="Ask…" aria-label="Message"></textarea><div class="row"><div><select id="model" aria-label="Model"></select><select id="mode" aria-label="Source"><option value="general">General chat</option><option value="vault">Search my notes</option></select><select id="vault" aria-label="Vault" hidden></select><label><input type="checkbox" id="concise"> Concise</label></div><button id="send" aria-label="Send">↑</button></div></form><div id="hint"></div></footer></section>
<section id="notes" class="view" hidden><div class="nb"><select id="nv" aria-label="Vault"></select><button id="nn">+ Note</button><span id="np">No note open</span><button id="sv" disabled>Save</button></div><div id="ns" class="ns" hidden></div><div id="nv-wrap"><nav id="nl" aria-label="Notes"></nav><textarea id="ed" spellcheck="false" disabled aria-label="Note editor"></textarea></div></section>
</main>
<aside><h4>PATH</h4><div id="trail"><div id="empty">Idle. Search my notes to trace a path.</div></div></aside>
</div>
<dialog id="login"><form id="lf"><div class="logo" style="margin-bottom:18px">A.R.I.A</div><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><p id="le" role="alert"></p><button id="lb">Enter</button><button type="button" id="skip">Close</button></form></dialog>
<script type="module">
const $=id=>document.getElementById(id),el=(t,x)=>{const n=document.createElement(t);if(x!==undefined)n.textContent=x;return n};
let history=[],signedIn=false,busy=false,cfg,cur=null;
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401){signedIn=false;$('login').showModal()}if(!r.ok)throw new Error(d.error||'Request failed.');return d}
async function chat(body,on){
 const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/x-ndjson'},body:JSON.stringify(body)});
 if(r.status===401){signedIn=false;$('login').showModal()}
 if(!r.ok||!r.headers.get('content-type')?.includes('ndjson')){const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}
 const rd=r.body.getReader(),dec=new TextDecoder();let buf='',res;
 const eat=l=>{if(!l.trim())return;const e=JSON.parse(l);if(e.type==='error')throw new Error(e.error);if(e.type==='progress')on(e);if(e.type==='result')res=e};
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){eat(buf.slice(0,i));buf=buf.slice(i+1)}}
 eat(buf);if(!res)throw new Error('Connection ended before Aria finished.');return res}
// ---- markdown (DOM only, raw HTML is text). [S#] becomes a clickable citation carrying its claim sentence.
const strip=s=>s.replace(/\[S\d+\]/g,'');
function claimOf(s,i){const last=strip(s.slice(0,i)).trim().split(/(?<=[.!?:;])\s+/).pop();return last.length>25?last:strip(s)}
function inl(p,s){const re=/(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|\[S\d+\]|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))/g;let o=0;
 for(const m of s.matchAll(re)){p.append(s.slice(o,m.index));const t=m[0];let n;
  if(t[0]==='`')n=el('code',t.slice(1,-1));
  else if(t.startsWith('**')){n=el('b');inl(n,t.slice(2,-2))}
  else if(t[0]==='*'){n=el('i');inl(n,t.slice(1,-1))}
  else if(/^\[S\d+\]$/.test(t)){n=el('button',t);n.type='button';n.className='c';n.dataset.s=t.slice(1,-1);n.dataset.claim=claimOf(s,m.index)}
  else{const x=/^\[([^\]]+)\]\((.+)\)$/.exec(t);n=el('a',x[1]);n.href=x[2];n.target='_blank';n.rel='noopener noreferrer'}
  p.append(n);o=m.index+t.length}
 p.append(s.slice(o))}
function md(root,text){const L=text.replace(/\r\n?/g,'\n').split('\n');root.replaceChildren();let list=null;
 for(let i=0;i<L.length;){const l=L[i];
  if(!l.trim()){i++;list=null;continue}
  const li=/^(\s*)([-+*]|\d+[.)])\s+(.+)$/.exec(l);
  if(li){const t=/\d/.test(li[2])?'ol':'ul';if(!list||list.localName!==t){list=el(t);root.append(list)}const x=el('li');x.style.marginLeft=Math.min(li[1].length,8)*6+'px';inl(x,li[3]);list.append(x);i++;continue}
  list=null;
  if(/^\s*```/.test(l)){const c=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))c.push(L[i++]);i++;const p=el('pre');p.append(el('code',c.join('\n')));root.append(p);continue}
  const h=/^\s{0,3}#{1,6}\s+(.+)$/.exec(l);if(h){const n=el('h3');inl(n,h[1]);root.append(n);i++;continue}
  if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){root.append(el('hr'));i++;continue}
  if(l.includes('|')&&L[i+1]&&L[i+1].includes('-')&&/^[\s|:-]+$/.test(L[i+1])){const c=s=>s.trim().replace(/^\||\|$/g,'').split('|'),w=el('div'),t=el('table');w.className='tw';let r=el('tr');for(const x of c(l)){const th=el('th');inl(th,x.trim());r.append(th)}t.append(r);i+=2;while(i<L.length&&L[i].trim()&&L[i].includes('|')){r=el('tr');for(const x of c(L[i++])){const td=el('td');inl(td,x.trim());r.append(td)}t.append(r)}w.append(t);root.append(w);continue}
  if(/^>\s?/.test(l)){const q=el('blockquote');inl(q,l.replace(/^>\s?/,''));root.append(q);i++;continue}
  const p=el('p');inl(p,l);root.append(p);i++}}
// ---- messages, references (collapsed), citation highlight
function msg(role,text){const it=el('article');it.className='m '+role;const w=el('div','YOU');if(role!=='user')w.textContent='ARIA';w.className='who';const b=el('div');b.className='md';if(role==='user')b.textContent=text;else b.textContent=text;it.append(w,b);$('msgs').append(it);$('welcome').hidden=true;$('scroll').scrollTop=1e9;return it}
function refs(it,src){if(!src.length)return;const d=el('details');d.className='refs';d.append(el('summary','References ('+src.length+')'));
 for(const x of src){const e=el('details');e.className='src';e.dataset.s=x.id;e.dataset.path=x.path;const p=el('p',x.excerpt);p.className='ex';p.dataset.t=x.excerpt;const sm=el('small',(x.vault?x.vault+' / ':'')+x.path);e.append(el('summary','['+x.id+'] '+x.title),sm,p);d.append(e)}it.append(d)}
const words=s=>s.toLowerCase().match(/[\p{L}\p{N}]{4,}/gu)||[];
function hl(p,claim){const cw=new Set(words(claim)),segs=p.dataset.t.match(/[^.!?\n]+[.!?]*\s*|\n+/g)||[],sc=segs.map(s=>words(s).filter(w=>cw.has(w)).length),best=Math.max(0,...sc);
 p.replaceChildren();let first=null,k=0;segs.forEach((s,i)=>{if(best>0&&sc[i]>=Math.max(1,best*.6)&&k<3){const m=el('mark',s);p.append(m);first??=m;k++}else p.append(s)});return first}
$('msgs').onclick=e=>{const b=e.target.closest('.c');if(!b)return;const it=b.closest('.m'),src=it.querySelector('.src[data-s="'+b.dataset.s+'"]');if(!src)return;
 it.querySelector('.refs').open=true;it.querySelectorAll('.src').forEach(x=>x.open=x===src);it.querySelectorAll('.c').forEach(x=>x.classList.toggle('on',x===b));
 const mk=hl(src.querySelector('.ex'),b.dataset.claim);lit(src.dataset.path);(mk||src).scrollIntoView({block:'center',behavior:'smooth'})};
// ---- vault path sidebar
const trail=$('trail'),nodes=new Map();
function node(cls,label,key){$('empty')?.remove();const d=el('div',label);d.className='n '+cls;if(key)nodes.set(key,d);trail.append(d);d.scrollIntoView({block:'nearest',behavior:'smooth'});return d}
const cool=()=>trail.querySelectorAll('.hot').forEach(n=>n.classList.remove('hot'));
function lit(path){nodes.forEach(n=>n.classList.remove('lit','hot'));const n=nodes.get(path);if(n){n.classList.add('lit');n.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function onProgress(it,ev){
 if(ev.stage==='search'){cool();node('q hot','⌕ '+(ev.query.length>90?ev.query.slice(0,90)+'…':ev.query))}
 else if(ev.stage==='results'){for(const n of ev.notes){const old=nodes.get(n.path);if(old){old.classList.remove('hot');void old.offsetWidth;old.classList.add('hot')}else node('hot',(n.vault?n.vault+' / ':'')+n.path,n.path)}}
 else if(ev.stage==='planning'||ev.stage==='answering'){it.querySelector('.md').textContent=ev.message;if(ev.stage==='answering'){cool();node('q hot','compose answer')}}
 else if(ev.stage==='thought-summary'){let t=it.querySelector('.th');if(!t){t=el('details');t.className='th';t.append(el('summary','Thinking'),el('div'));it.querySelector('.who').after(t)}t.lastChild.append(ev.text)}}
// ---- ui
const err=m=>{$('err').textContent=m;$('err').hidden=!m};
function reset(){history=[];$('msgs').replaceChildren();$('welcome').hidden=false;err('');nodes.clear();trail.replaceChildren(Object.assign(el('div','Idle. Search my notes to trace a path.'),{id:'empty'}))}
function upd(){const m=cfg?.models.find(m=>m.id===$('model').value);$('hint').textContent=m?m.rpm+'/min · '+m.rpd+'/day · notes use 2–3 calls · check answers against sources':''}
function acct(email){signedIn=true;$('who').textContent=email;$('out').hidden=false;if($('login').open)$('login').close();loadVaults()}
async function loadVaults(){try{const{vaults}=await api('vaults');const v=$('vault'),n=$('nv');v.replaceChildren(new Option('All vaults','all'));n.replaceChildren();for(const x of vaults){v.append(new Option(x.name,x.id));n.append(new Option(x.name,x.id))}}catch{}}
$('model').onchange=upd;$('mode').onchange=()=>{reset();$('vault').hidden=$('mode').value!=='vault'};
$('pt').onclick=()=>$('app').classList.toggle('pt');
$('skip').onclick=()=>$('login').close();
$('lf').onsubmit=async e=>{e.preventDefault();$('lb').disabled=true;$('le').textContent='';try{acct((await api('login',{email:$('email').value,password:$('pw').value})).email);$('pw').value=''}catch(x){$('le').textContent=x.message}finally{$('lb').disabled=false}};
$('out').onclick=async()=>{try{await api('logout',{});signedIn=false;reset();$('who').textContent='';$('out').hidden=true;$('login').showModal()}catch(x){err(x.message)}};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('f').requestSubmit()}};
$('f').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!signedIn){$('login').showModal();return}
 const t=$('q').value.trim();if(!t)return;err('');busy=true;for(const i of ['send','mode','model','concise'])$(i).disabled=true;
 const vault=$('mode').value==='vault';msg('user',t);$('q').value='';nodes.clear();trail.replaceChildren();
 if(vault)node('q hot','A.R.I.A › '+($('vault').selectedOptions[0]?.text||'vault'));
 const it=msg('model',vault?'Researching your notes…':'Thinking…');
 try{const d=await chat({message:t,model:$('model').value,mode:$('mode').value,vault:$('vault').value||'all',history:history.slice(-6),concise:$('concise').checked},ev=>onProgress(it,ev));
  const r=d.research;md(it.querySelector('.md'),d.answer+(d.truncated?'\n\n[Answer reached its output limit.]':'')+(r?'\n\nResearch: '+r.searches+' searches · '+(r.planningCalls+1)+' model calls'+(r.warnings.length?'\n\n'+r.warnings.join(' '):''):''));
  refs(it,d.sources||[]);cool();
  history.push({role:'user',text:t},{role:'model',text:d.answer.slice(0,6000)});while(JSON.stringify(history.slice(-6)).length>16000)history.splice(0,2);history=history.slice(-6)}
 catch(x){it.querySelector('.md').textContent='Request stopped: '+x.message;err(x.message);$('q').value=t;cool()}
 finally{busy=false;for(const i of ['send','mode','model','concise'])$(i).disabled=false;$('q').focus()}};
// ---- tabs and notes
function tab(n){$('chat').hidden=n;$('notes').hidden=!n;$('app').classList.toggle('nm',n);$('tc').classList.toggle('on',!n);$('tn').classList.toggle('on',n);if(n&&signedIn)nList()}
$('tc').onclick=()=>tab(false);$('tn').onclick=()=>tab(true);
const ns=m=>{$('ns').textContent=m;$('ns').hidden=!m};
async function nList(){const v=$('nv').value;if(!v)return;try{const{notes}=await api('notes?vault='+v),l=$('nl');l.replaceChildren();for(const n of notes){const b=el('button',n.path);b.className=cur?.path===n.path?'on':'';b.onclick=()=>nOpen(n.path);l.append(b)}}catch(x){ns(x.message)}}
async function nOpen(path){try{const n=await api('note-read',{vault:$('nv').value,path});cur={path:n.path,version:n.version};$('ed').value=n.content;$('ed').disabled=false;$('sv').disabled=false;$('np').textContent=n.path+' · v'+n.version;ns('');nList()}catch(x){ns(x.message)}}
$('nv').onchange=()=>{cur=null;$('ed').value='';$('ed').disabled=true;$('sv').disabled=true;$('np').textContent='No note open';nList()};
$('sv').onclick=async()=>{if(!cur)return;try{const r=await api('note',{vault:$('nv').value,path:cur.path,content:$('ed').value,baseVersion:cur.version});cur.version=r.version;$('np').textContent=cur.path+' · saved v'+r.version;ns('')}catch(x){ns(x.message)}};
$('nn').onclick=async()=>{const p=prompt('Path (folder/Name.md):','00 Inbox/Untitled.md');if(!p)return;try{await api('note',{vault:$('nv').value,path:p,content:'---\nai_enabled: false\n---\n\n# '+p.split('/').pop().replace(/\.md$/i,'')+'\n',baseVersion:0});await nOpen(p)}catch(x){ns(x.message)}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('notes').hidden){e.preventDefault();$('sv').click()}});
try{cfg=await api('status');for(const m of cfg.models)$('model').append(new Option(m.name,m.id));upd();
 if(!cfg.configured||!cfg.geminiReady){$('setup').hidden=false;$('setup').textContent='Preview mode: finish Supabase and Gemini setup to enable answers.'}
 if(cfg.configured)try{acct((await api('session')).email)}catch{}}catch{err('Could not reach the app server.')}
</script></body></html>
