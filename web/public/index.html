<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.R.I.A</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace}

#f{border:1px solid #333;padding:12px;transition:border-color .3s}#f:focus-within{border-color:#fff}

.sw input:checked+i{background:#fff}.sw input:checked+i::after{background:#000;transform:translateX(14px)}
.sw input:focus-visible+i{outline:1px solid #fff;outline-offset:2px}
.warn{border:1px solid #fff;padding:4px 8px;margin-top:6px;font-size:12px;animation:up .3s both}

.at button{border:0;padding:0 4px;color:#777}
.pick{position:relative}

.po.on{background:#fff;color:#000}.po.on small{color:#555}
.ab{display:flex;gap:8px}
#cur{font-size:11px;color:#777;margin-bottom:12px;overflow-wrap:anywhere;animation:up .3s both}#cur:empty{display:none}
.vn{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#777;margin-bottom:8px}
.fh{position:relative;padding:2px 6px 2px 16px;color:#bbb;font-size:13px;overflow-wrap:anywhere}
.fh::before{content:"▾";position:absolute;left:2px;color:#777;font-size:10px}
.fk{margin-left:7px;padding-left:10px;border-left:1px solid #222}
.fi{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 6px;color:#777;font-size:13px;text-align:left;overflow-wrap:anywhere;animation:in .4s both;transition:color .3s,background .3s}

#pt{display:none}
@media(max-width:860px){#app,#app.nm{grid-template:"h" 56px "m" 1fr/1fr}#pt{display:flex}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="module">
const $=id=>document.getElementById(id),el=(t,x)=>{const n=document.createElement(t);if(x!==undefined)n.textContent=x;return n};
let history=[],signedIn=false,busy=false,cfg,cur=null,depth=1,first=true;
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401){signedIn=false;$('login').showModal()}if(!r.ok)throw new Error(d.error||'Request failed.');return d}
async function chat(body,on){
 const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/x-ndjson'},body:JSON.stringify(body)});
 if(r.status===401){signedIn=false;$('login').showModal()}
 if(!r.ok||!r.headers.get('content-type')?.includes('ndjson')){const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}
 const rd=r.body.getReader(),dec=new TextDecoder();let buf='',res;

// ---- markdown (DOM only, raw HTML is text). [S#] becomes a clickable citation carrying its claim sentence.
const strip=s=>s.replace(/\[S\d+\]/g,'');
function claimOf(s,i){const last=strip(s.slice(0,i)).trim().split(/(?<=[.!?:;])\s+/).pop();return last.length>25?last:strip(s)}
function inl(p,s){const re=/(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|\[S\d+\]|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))/g;let o=0;
 for(const m of s.matchAll(re)){p.append(s.slice(o,m.index));const t=m[0];let n;
  if(t[0]==='`')n=el('code',t.slice(1,-1));
  else if(t.startsWith('**')){n=el('b');inl(n,t.slice(2,-2))}
  else if(t[0]==='*'){n=el('i');inl(n,t.slice(1,-1))}
  else if(/^\[S\d+\]$/.test(t)){n=el('button',t);n.type='button';n.className='c';n.dataset.s=t.slice(1,-1);n.dataset.claim=claimOf(s,m.index)}
  else{const x=/^\[([^\]]+)\]\((.+)\)$/.exec(t);n=el('a',x[1]);n.href=x[2];n.target='_blank';n.rel='noopener noreferrer'}
  p.append(n);o=m.index+t.length}
 p.append(s.slice(o))}
function md(root,text){const L=text.replace(/\r\n?/g,'\n').split('\n');root.replaceChildren();let list=null;
 for(let i=0;i<L.length;){const l=L[i];
  if(!l.trim()){i++;list=null;continue}
  const li=/^(\s*)([-+*]|\d+[.)])\s+(.+)$/.exec(l);
  if(li){const t=/\d/.test(li[2])?'ol':'ul';if(!list||list.localName!==t){list=el(t);root.append(list)}const x=el('li');x.style.marginLeft=Math.min(li[1].length,8)*6+'px';inl(x,li[3]);list.append(x);i++;continue}
  list=null;
  if(/^\s*```/.test(l)){const c=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))c.push(L[i++]);i++;const p=el('pre');p.append(el('code',c.join('\n')));root.append(p);continue}
  const h=/^\s{0,3}#{1,6}\s+(.+)$/.exec(l);if(h){const n=el('h3');inl(n,h[1]);root.append(n);i++;continue}
  if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){root.append(el('hr'));i++;continue}
  if(l.includes('|')&&L[i+1]&&L[i+1].includes('-')&&/^[\s|:-]+$/.test(L[i+1])){const c=s=>s.trim().replace(/^\||\|$/g,'').split('|'),w=el('div'),t=el('table');w.className='tw';let r=el('tr');for(const x of c(l)){const th=el('th');inl(th,x.trim());r.append(th)}t.append(r);i+=2;while(i<L.length&&L[i].trim()&&L[i].includes('|')){r=el('tr');for(const x of c(L[i++])){const td=el('td');inl(td,x.trim());r.append(td)}t.append(r)}w.append(t);root.append(w);continue}
  if(/^>\s?/.test(l)){const q=el('blockquote');inl(q,l.replace(/^>\s?/,''));root.append(q);i++;continue}
  const p=el('p');inl(p,l);root.append(p);i++}}
// ---- messages, references (collapsed), citation highlight
function msg(role,text){const it=el('article');it.className='m '+role;const w=el('div','YOU');if(role!=='user')w.textContent='ARIA';w.className='who';const b=el('div');b.className='md';if(role==='user')b.textContent=text;else b.textContent=text;it.append(w,b);$('msgs').append(it);$('welcome').hidden=true;$('scroll').scrollTop=1e9;return it}
function refs(it,src){if(!src.length)return;const d=el('details');d.className='refs';d.append(el('summary','References ('+src.length+')'));
 for(const x of src){const e=el('details');e.className='src';e.dataset.s=x.id;e.dataset.path=x.path;const p=el('p',x.excerpt);p.className='ex';p.dataset.t=x.excerpt;const sm=el('small',(x.vault?x.vault+' / ':'')+x.path);e.append(el('summary','['+x.id+'] '+x.title),sm,p);d.append(e)}it.append(d)}
const words=s=>s.toLowerCase().match(/[\p{L}\p{N}]{4,}/gu)||[];
function hl(p,claim){const cw=new Set(words(claim)),segs=p.dataset.t.match(/[^.!?\n]+[.!?]*\s*|\n+/g)||[],sc=segs.map(s=>words(s).filter(w=>cw.has(w)).length),best=Math.max(0,...sc);
 p.replaceChildren();let first=null,k=0;segs.forEach((s,i)=>{if(best>0&&sc[i]>=Math.max(1,best*.6)&&k<3){const m=el('mark',s);p.append(m);first??=m;k++}else p.append(s)});return first}
$('msgs').onclick=e=>{const b=e.target.closest('.c');if(!b)return;const it=b.closest('.m'),src=it.querySelector('.src[data-s="'+b.dataset.s+'"]');if(!src)return;
 it.querySelector('.refs').open=true;it.querySelectorAll('.src').forEach(x=>x.open=x===src);it.querySelectorAll('.c').forEach(x=>x.classList.toggle('on',x===b));
 const mk=hl(src.querySelector('.ex'),b.dataset.claim);src.querySelector('.warn')?.remove();
 const lg=s=>new Set((s.match(/\b(and|or)\b/gi)||[]).map(x=>x.toLowerCase())),c=lg(b.dataset.claim),g=lg([...src.querySelectorAll('mark')].map(m=>m.textContent).join(' '));
 if(c.size&&g.size&&![...c].some(x=>g.has(x))){const w=el('div','Check: the answer says “'+[...c].join('/')+'” but this passage says “'+[...g].join('/')+'”.');w.className='warn';src.querySelector('small').after(w)}
 lit(src.dataset.path);(mk||src).scrollIntoView({block:'center',behavior:'smooth'})};
// ---- vault path sidebar
const trail=$('trail'),nodes=new Map(),dirs=new Map();let order=0;
function dir(path){if(!path)return trail;if(dirs.has(path))return dirs.get(path);const i=path.lastIndexOf('/'),par=dir(i<0?'':path.slice(0,i)),f=el('div'),h=el('div',path.slice(i+1)),k=el('div');h.className='fh';k.className='fk';f.append(h,k);par.append(f);dirs.set(path,k);return k}
function file(n){let d=nodes.get(n.path);if(d){d.classList.remove('hot');void d.offsetWidth;d.classList.add('hot');return}
 const i=n.path.lastIndexOf('/');d=el('div');d.className='fi hot';d.append(el('span',n.path.slice(i+1).replace(/\.md$/i,'')),el('b',String(++order)));dir(i<0?'':n.path.slice(0,i)).append(d);nodes.set(n.path,d);d.scrollIntoView({block:'nearest',behavior:'smooth'})}

function onProgress(it,ev){
 if(ev.stage==='search'){cool();$('cur').textContent='⌕ '+(first?'your question':ev.query.length>90?ev.query.slice(0,90)+'…':ev.query);first=false}
 else if(ev.stage==='results'){for(const n of ev.notes)file(n)}

// ---- ui
const err=m=>{$('err').textContent=m;$('err').hidden=!m};
function reset(){history=[];$('msgs').replaceChildren();$('welcome').hidden=false;err('');nodes.clear();dirs.clear();order=0;trail.replaceChildren();$('cur').textContent=''}
const GEM='<svg viewBox="0 0 24 24"><path d="M12 2c.5 5.5 4.5 9.5 10 10-5.5.5-9.5 4.5-10 10-.5-5.5-4.5-9.5-10-10 5.5-.5 9.5-4.5 10-10z"/></svg>',DS='<svg viewBox="0 0 24 24"><path d="M2 14c0-4 4-8 10-8 4 0 7 2 8 5l2-2-.5 6c-1 3-5 5-10 5-5 0-9.5-2-9.5-6z"/><circle cx="9" cy="12" r=".8"/></svg>';
function buildModels(){const p=$('pm');p.replaceChildren();const g=el('div');g.className='pg';g.innerHTML=GEM+'GEMINI';p.append(g);
 for(const m of cfg.models){const b=el('button',m.name);b.type='button';b.className='po'+(m.id===$('model').value?' on':'');b.dataset.id=m.id;b.append(el('small',m.rpm+'/min · '+m.rpd+'/day'));p.append(b)}
 const d=el('div');d.className='pg off';d.innerHTML=DS+'DEEPSEEK · OFF';p.append(d)}
function upd(){const m=cfg?.models.find(m=>m.id===$('model').value);$('mp').title=m?.name||'';}
function acct(email){signedIn=true;$('out').hidden=false;if($('login').open)$('login').close();loadVaults()}
async function loadVaults(){try{const{vaults}=await api('vaults');const v=$('vault'),n=$('nv');v.replaceChildren(new Option('All vaults','all'));n.replaceChildren();for(const x of vaults){v.append(new Option(x.name,x.id));n.append(new Option(x.name,x.id))}}catch{}}
function setMode(v){$('mode').value=v;$('mc').classList.toggle('on',v==='general');$('mv').classList.toggle('on',v==='vault');reset();$('vault').hidden=v!=='vault'}
$('mc').onclick=()=>!busy&&setMode('general');$('mv').onclick=()=>!busy&&setMode('vault');
$('mp').onclick=()=>{if(cfg)$('pm').hidden=!$('pm').hidden};
$('pm').onclick=e=>{const b=e.target.closest('.po');if(!b)return;$('model').value=b.dataset.id;buildModels();upd();$('pm').hidden=true};
document.addEventListener('click',e=>{if(!e.target.closest('.pick'))$('pm').hidden=true});
$('pt').onclick=()=>$('app').classList.toggle('pt');
$('skip').onclick=()=>$('login').close();
$('lf').onsubmit=async e=>{e.preventDefault();$('lb').disabled=true;$('le').textContent='';try{acct((await api('login',{email:$('email').value,password:$('pw').value})).email);$('pw').value=''}catch(x){$('le').textContent=x.message}finally{$('lb').disabled=false}};
$('out').onclick=async()=>{try{await api('logout',{});signedIn=false;reset();$('out').hidden=true;$('login').showModal()}catch(x){err(x.message)}};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('f').requestSubmit()}};
$('f').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!signedIn){$('login').showModal();return}
 const t=$('q').value.trim()||(files.length?'What does this show?':'');if(!t)return;err('');busy=true;for(const i of ['send','add','mc','mv','mp','concise'])$(i).disabled=true;
 const vault=$('mode').value==='vault';msg('user',t+(files.length?'\n'+files.map(f=>'[attached: '+f.name+']').join(' '):''));const sent=files;files=[];renderAtt();$('q').value='';nodes.clear();dirs.clear();order=0;trail.replaceChildren();first=true;
 $('cur').textContent='';if(vault){const v=el('div',$('vault').selectedOptions[0]?.text||'vault');v.className='vn';trail.append(v)}
 const it=msg('model',vault?'Researching your notes…':'Thinking…');
 try{const d=await chat({message:t,model:$('model').value,mode:$('mode').value,vault:$('vault').value||'all',history:history.slice(-6),concise:$('concise').checked,files:sent.map(({mime,data})=>({mime,data}))},ev=>onProgress(it,ev));
  const r=d.research;md(it.querySelector('.md'),d.answer+(d.truncated?'\n\n[Answer reached its output limit.]':'')+(r?'\n\nResearch: '+r.searches+' searches · '+(r.planningCalls+1)+' model calls'+(r.warnings.length?'\n\n'+r.warnings.join(' '):''):''));
  refs(it,d.sources||[]);cool();
  history.push({role:'user',text:t},{role:'model',text:d.answer.slice(0,6000)});while(JSON.stringify(history.slice(-6)).length>16000)history.splice(0,2);history=history.slice(-6)}
 catch(x){it.querySelector('.md').textContent='Request stopped: '+x.message;err(x.message);$('q').value=t;files=sent;renderAtt();cool()}
 finally{busy=false;for(const i of ['send','add','mc','mv','mp','concise'])$(i).disabled=false;$('q').focus()}};
// ---- attachments (images are shrunk to JPEG <=1600px; PDFs sent as-is; ~2.8 MB total)
let files=[];
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
async function shrink(f){const bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}
function renderAtt(){const a=$('att');a.replaceChildren();files.forEach((f,i)=>{const d=el('span');d.className='at';if(f.mime!=='application/pdf'){const im=el('img');im.src='data:'+f.mime+';base64,'+f.data;im.alt='';d.append(im)}d.append(el('span',f.name));const x=el('button','×');x.type='button';x.setAttribute('aria-label','Remove');x.onclick=()=>{files.splice(i,1);renderAtt()};d.append(x);a.append(d)})}
async function addFiles(list){for(const f of list){if(files.length>=4){err('Up to 4 attachments.');break}
 try{let mime=f.type,blob=f;if(mime.startsWith('image/')){blob=await shrink(f);mime='image/jpeg'}else if(mime!=='application/pdf'){err('Only images and PDFs are supported.');continue}
  const data=await b64(blob);if(files.reduce((n,x)=>n+x.data.length,0)+data.length>3.9e6){err('Attachments are too large (about 2.8 MB total).');continue}
  files.push({mime,data,name:f.name||'screenshot'});err('')}catch{err('Could not read '+(f.name||'that file')+'.')}}
 renderAtt()}
$('add').onclick=()=>$('file').click();
$('file').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};
document.addEventListener('paste',e=>{if($('chat').hidden||$('login').open)return;const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')||f.type==='application/pdf');if(fs.length){e.preventDefault();addFiles(fs)}});
$('f').addEventListener('dragover',e=>e.preventDefault());
$('f').addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addFiles([...e.dataTransfer.files])}});
// in-page replacement for prompt(): resolves to the text, or null if cancelled
function ask(label,val=''){return new Promise(ok=>{const d=$('ask');let v=null;$('al').textContent=label;$('av').value=val;d.onclose=()=>ok(v);$('af').onsubmit=e=>{e.preventDefault();v=$('av').value.trim()||null;d.close()};$('ac').onclick=()=>d.close();d.showModal();$('av').select()})}
// ---- tabs and notes
function tab(n){$('chat').hidden=n;$('notes').hidden=!n;$('app').classList.toggle('nm',n);$('tc').classList.toggle('on',!n);$('tn').classList.toggle('on',n);if(n&&signedIn)nList()}
$('tc').onclick=()=>tab(false);$('tn').onclick=()=>tab(true);
const ns=m=>{$('ns').textContent=m;$('ns').hidden=!m};
async function nList(){const v=$('nv').value;if(!v)return;try{const{notes}=await api('notes?vault='+v),l=$('nl');l.replaceChildren();for(const n of notes){const b=el('button',n.path);b.className=cur?.path===n.path?'on':'';b.onclick=()=>nOpen(n.path);l.append(b)}}catch(x){ns(x.message)}}
async function nOpen(path){try{const n=await api('note-read',{vault:$('nv').value,path});cur={path:n.path,version:n.version};$('ed').value=n.content;$('ed').disabled=false;$('sv').disabled=false;$('np').textContent=n.path+' · v'+n.version;ns('');nList()}catch(x){ns(x.message)}}
$('nv').onchange=()=>{cur=null;$('ed').value='';$('ed').disabled=true;$('sv').disabled=true;$('np').textContent='No note open';nList()};
$('sv').onclick=async()=>{if(!cur)return;try{const r=await api('note',{vault:$('nv').value,path:cur.path,content:$('ed').value,baseVersion:cur.version});cur.version=r.version;$('np').textContent=cur.path+' · saved v'+r.version;ns('')}catch(x){ns(x.message)}};
$('nn').onclick=async()=>{const p=await ask('Path (folder/Name.md)','00 Inbox/Untitled.md');if(!p)return;try{await api('note',{vault:$('nv').value,path:p,content:'---\nai_enabled: false\n---\n\n# '+p.split('/').pop().replace(/\.md$/i,'')+'\n',baseVersion:0});await nOpen(p)}catch(x){ns(x.message)}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('notes').hidden){e.preventDefault();$('sv').click()}});
const h=new Date().getHours();$('gr').textContent=h>=5&&h<12?'Good morning.':h>=12&&h<18?'Good afternoon.':'Good evening.';
try{cfg=await api('status');$('model').value=cfg.models[0].id;buildModels();upd();
 if(!cfg.configured||!cfg.geminiReady){$('setup').hidden=false;$('setup').textContent='Preview mode: finish Supabase and Gemini setup to enable answers.'}
 if(cfg.configured)try{acct((await api('session')).email)}catch{}}catch{err('Could not reach the app server.')}
</script></body></html>
